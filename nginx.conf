server {
    listen 80;
    server_name smartgridlab.cz smartgridlabs.cz www.smartgridlab.cz www.smartgridlabs.cz;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Root → redirect to /cs/ or /en/ based on Accept-Language
    location = / {
        # Try to serve redirect page (handles JS-based detection)
        try_files /index.html =404;
    }

    # Language routes
    location /cs/ {
        try_files $uri $uri/ /cs/index.html;
    }

    location /en/ {
        try_files $uri $uri/ /en/index.html;
    }

    # Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()";
}
